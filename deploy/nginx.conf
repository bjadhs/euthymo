# Template for a Hostinger VPS. Install only after checking the existing server setup.
# TLS certificate paths must exist first (for example, provisioned by Certbot).
# Both DNS names must point to the server before obtaining the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name euthymo.com www.euthymo.com;
    return 301 https://www.euthymo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name euthymo.com;
    ssl_certificate /etc/letsencrypt/live/euthymo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euthymo.com/privkey.pem;
    return 301 https://www.euthymo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.euthymo.com;
    ssl_certificate /etc/letsencrypt/live/euthymo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euthymo.com/privkey.pem;

    # Point this symlink to a complete release copied from the build's out/ directory.
    root /var/www/euthymo/current;
    index index.html;
    server_tokens off;

    # No visitor logs at this layer. Confirm upstream Hostinger/CDN/security logging
    # separately and describe the actual production behavior in the privacy policy.
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Next.js emits content-hashed assets; HTML should remain revalidatable.
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
